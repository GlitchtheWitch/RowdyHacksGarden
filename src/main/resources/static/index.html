<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Marauder's Map</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            background: #111;
            color: white;

            font-family: monospace;

            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: 100vh;

            padding: 20px;
        }


        h1 {
            margin-bottom: 16px;

            font-size: 20px;

            color: #aaa;
        }


        #map-container {
            position: relative;

            width: min(95vw, 1200px);

            aspect-ratio: 2048 / 1423;

            background: #000;

            border: 2px solid #333;

            border-radius: 8px;

            overflow: hidden;
        }


        #floor-plan {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: contain;

            top: 0;
            left: 0;
        }


        .dot {
            position: absolute;

            width: 14px;
            height: 14px;

            background: #ff4444;

            border: 2px solid white;

            border-radius: 50%;

            transform: translate(-50%, -50%);

            transition:
                    left 0.8s ease,
                    top 0.8s ease;

            z-index: 10;
        }


        .name-tag {
            position: absolute;

            top: -22px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 11px;

            color: white;

            background: rgba(0, 0, 0, 0.75);

            padding: 2px 6px;

            border-radius: 3px;

            white-space: nowrap;

            pointer-events: none;
        }


        #status {
            margin-top: 12px;

            font-size: 12px;

            color: #666;
        }

    </style>

</head>


<body>

<h1>Agents on the Field</h1>


<div id="map-container">

    <img
            id="floor-plan"
            src="/map.png"
            alt="Building Map"
    >

</div>


<div id="status">
    Connecting...
</div>


<script src="/sockjs/js/sockjs.min.js"></script>

<script src="/webjars/stomp.js/2.3.4/stomp.min.js"></script>


<script>

    const container =
        document.getElementById("map-container");

    const status =
        document.getElementById("status");


    const dots = {};


    // Connect to Spring Boot
    const sock = new SockJS("/ws");

    const stompClient = Stomp.over(sock);


    stompClient.connect({}, () => {

        console.log("Connected to server");

        status.textContent =
            "Connected. Waiting for devices...";


        // Listen for device updates
        stompClient.subscribe(
            "/topic/updates",
            (message) => {

                const data =
                    JSON.parse(message.body);


                const deviceId =
                    data.deviceId;

                const x =
                    data.x;

                const y =
                    data.y;


                // Create dot if device doesn't exist
                let dot = dots[deviceId];


                if (!dot) {

                    dot =
                        document.createElement("div");

                    dot.className = "dot";


                    const tag =
                        document.createElement("div");

                    tag.className = "name-tag";

                    tag.textContent =
                        deviceId;


                    dot.appendChild(tag);


                    container.appendChild(dot);


                    dots[deviceId] = dot;
                }


                // Position dot on map
                dot.style.left = x + "%";

                dot.style.top = y + "%";


                status.textContent =
                    Object.keys(dots).length +
                    " device(s) tracked";
            }
        );

    }, (error) => {

        console.error(
            "WebSocket error:",
            error
        );

        status.textContent =
            "Connection failed.";

    });


    sock.onclose = () => {

        status.textContent =
            "Disconnected.";

    };

</script>

</body>

</html>
